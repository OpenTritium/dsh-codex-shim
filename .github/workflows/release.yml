name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 47f943859bef60e4160492346772ded9b24f765a
          path: upstream

      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm install --frozen-lockfile
        working-directory: upstream

      - run: pnpm run build
        working-directory: upstream

      - name: Link pinned DSH peers
        run: |
          node --input-type=module <<'NODE'
          import { mkdirSync, readdirSync, readFileSync, symlinkSync } from 'node:fs'
          import { dirname, join } from 'node:path'

          const shim = process.cwd()
          const upstream = join(shim, 'upstream')
          const peers = Object.keys(JSON.parse(readFileSync(join(shim, 'package.json'))).peerDependencies)
            .filter(name => name.startsWith('@deepseek-ai/'))
          const packages = new Map()
          const collect = directory => {
            for (const entry of readdirSync(directory, { withFileTypes: true })) {
              if (entry.name === 'node_modules' || entry.name === '.git') continue
              const path = join(directory, entry.name)
              if (entry.isDirectory()) collect(path)
              if (entry.isFile() && entry.name === 'package.json') {
                const manifest = JSON.parse(readFileSync(path))
                if (typeof manifest.name === 'string') packages.set(manifest.name, dirname(path))
              }
            }
          }

          collect(join(upstream, 'packages'))
          packages.set('@deepseek-ai/cordis', join(upstream, 'vendor', 'cordis'))
          for (const peer of peers) {
            const source = packages.get(peer)
            if (source === undefined) throw new Error(`missing pinned DSH peer ${peer}`)
            const target = join(shim, 'node_modules', peer)
            mkdirSync(dirname(target), { recursive: true })
            symlinkSync(source, target)
          }
          NODE

      - name: Verify release tag
        run: |
          version="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "v$version"

      - run: pnpm run check
      - run: git diff --exit-code -- lib
      - run: mkdir -p dist
      - run: pnpm pack --pack-destination dist

      - name: Verify tarball installation without a WebUI patch
        env:
          DSH_HOME: ${{ runner.temp }}/dsh-codex-shim-release-home
        run: |
          pnpm dsh plugin --profile web add "$GITHUB_WORKSPACE"/dist/*.tgz
          pnpm dsh --profile web --dump-config | grep -F "opentritium-codex-gate"
        working-directory: upstream

      - name: Verify the optional WebUI settings patch
        run: |
          git apply --check "$GITHUB_WORKSPACE/patches/deepseek-harness-settings-client-exposure-47f9438.patch"
          git apply "$GITHUB_WORKSPACE/patches/deepseek-harness-settings-client-exposure-47f9438.patch"
          pnpm run build
        working-directory: upstream

      - uses: actions/upload-artifact@v7
        with:
          name: dsh-codex-shim-${{ github.ref_name }}
          path: |
            dist/*.tgz
            patches/*.patch
          if-no-files-found: error

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.tgz patches/*.patch --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.tgz patches/*.patch --target "$GITHUB_SHA" --title "$GITHUB_REF_NAME" --generate-notes
          fi
